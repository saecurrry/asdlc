[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "asdlc"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[project.scripts]
asdlc = "asdlc.cli:main"

[tool.setuptools]
packages = ["asdlc"]

[tool.setuptools.package-data]
asdlc = ["schemas/*.json", "prompts/*.md"]
